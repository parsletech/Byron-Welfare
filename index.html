<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Welfare Capital OS — Financial Tracking Dashboard" />
    <title>Welfare Capital OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
    <style>
      @keyframes wcos-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body style="margin:0;background:#0A0C0E;">
    <div id="root">
      <!-- Static Pre-React Boot Fallback: Never show a blank white screen -->
      <div id="boot-wrapper" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0A0C0E;color:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;padding:24px;text-align:center;">
        <div style="width:44px;height:44px;border-radius:12px;background:#10B981;display:flex;align-items:center;justify-content:center;margin-bottom:20px;font-weight:900;font-family:monospace;color:#0A0C0E;font-size:22px;box-shadow:0 0 20px rgba(16,185,129,0.2);">
          W
        </div>
        <div id="boot-spinner" style="width:22px;height:22px;border:2px solid rgba(255,255,255,0.08);border-top-color:#10B981;border-radius:50%;animation:wcos-spin 0.7s linear infinite;margin-bottom:16px;"></div>
        <p id="boot-status" style="font-size:11px;font-family:monospace;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin:0;">
          INITIALIZING SYSTEM // WELFARE CAPITAL OS
        </p>
        <div id="boot-error-view" style="display:none;margin-top:24px;max-width:440px;padding:20px;border-radius:16px;background:#14181E;border:1px solid rgba(255,255,255,0.08);">
          <div style="display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;">
            <span style="width:8px;height:8px;border-radius:50%;background:#EF4444;"></span>
            <span style="font-size:11px;font-family:monospace;color:#EF4444;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;">Boot Interrupted</span>
          </div>
          <h2 style="font-size:16px;font-weight:700;color:#F8FAFC;margin:0 0 8px 0;">Application Bundle Load Timeout</h2>
          <p style="font-size:12px;color:rgba(255,255,255,0.5);line-height:1.5;margin:0 0 16px 0;">
            The browser could not load the application bundle within the expected time window. Your network connection or cached files may need a quick refresh.
          </p>
          <div style="display:flex;gap:8px;justify-content:center;">
            <button onclick="window.location.reload(true)" style="background:#10B981;color:#0A0C0E;border:none;padding:8px 16px;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;">
              Force Reload
            </button>
            <button onclick="localStorage.clear();sessionStorage.clear();window.location.reload(true)" style="background:transparent;color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.15);padding:8px 16px;border-radius:8px;font-weight:500;font-size:12px;cursor:pointer;">
              Clear Cache
            </button>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Fallback: If React doesn't mount and replace #root within 4 seconds, show actionable error view
      setTimeout(function() {
        var spinner = document.getElementById('boot-spinner');
        var status = document.getElementById('boot-status');
        var errView = document.getElementById('boot-error-view');
        if (spinner && errView) {
          spinner.style.display = 'none';
          if (status) status.innerText = 'SYSTEM // TIMEOUT';
          errView.style.display = 'block';
        }
      }, 4000);
    </script>
  </body>
</html>
